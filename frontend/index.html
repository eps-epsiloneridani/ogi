<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>OpenGraph Intel | Visual OSINT & Link Analysis Framework</title>
    <meta
      name="title"
      content="OpenGraph Intel | Visual OSINT & Link Analysis Framework"
    />
    <meta
      name="description"
      content="Open-source visual link analysis and OSINT platform. Map, discover, and visualize relationships between entities like DNS records, IP addresses, and organizations."
    />
    <meta
      name="keywords"
      content="OSINT, visual analysis, link analysis, graph intelligence, open source, network discovery, cybersecurity tool, digital forensics, OGI"
    />
    <meta name="author" content="OpenGraph Intel" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f1117" />

    <!-- Theme init: sets data-theme before first paint to prevent
         flash-of-wrong-theme. Reads a stored preference, falls back to the
         OS scheme, and defaults to dark. Mirrors resolveTheme() in
         src/lib/theme.ts. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("ogi-theme");
        } catch (e) {
          stored = null;
        }
        var theme;
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else {
          var prefersDark = window.matchMedia
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : true;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute(
            "content",
            theme === "dark" ? "#0f1117" : "#ffffff",
          );
        }
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ogi.khas.app/" />
    <meta
      property="og:title"
      content="OpenGraph Intel | Visual OSINT & Link Analysis Framework"
    />
    <meta
      property="og:description"
      content="Open-source visual link analysis and OSINT platform. Map, discover, and visualize relationships between entities like DNS records, IP addresses, and organizations."
    />
    <meta property="og:image" content="https://ogi.khas.app/ogi.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ogi.khas.app/" />
    <meta
      property="twitter:title"
      content="OpenGraph Intel | Visual OSINT & Link Analysis Framework"
    />
    <meta
      property="twitter:description"
      content="Open-source visual link analysis and OSINT platform. Map, discover, and visualize relationships between entities like DNS records, IP addresses, and organizations."
    />
    <meta property="twitter:image" content="https://ogi.khas.app/ogi.svg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ogi.khas.app/" />
  </head>

</html>
